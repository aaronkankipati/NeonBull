name: NEON BULL · Trading Watchdog

# ── WHY A WATCHDOG ─────────────────────────────────────────────
# GitHub Actions scheduled crons are NOT punctual — they can be
# 15-60 minutes late or silently skipped under load. A single cron
# at 9:30 AM is therefore unreliable as the sole trigger.
#
# This watchdog runs every 5 minutes during market hours only.
# Each run takes ~3 seconds if nothing needs doing (just a state
# check). It only does real work when the session window is open
# AND the session hasn't run yet. Max latency: 5 minutes.
#
# WINDOWS (IST):
#   Morning   9:25 AM – 10:30 AM  → fires morning decision once
#   Afternoon 2:25 PM – 3:30 PM   → fires afternoon snapshot once
#
# COST: ~66 Actions minutes/month of your 2,000 free minutes.
#
# SETUP (required once):
#   Repo → Settings → Secrets → Actions → New secret
#   Name : NEON_BULL_SECRET
#   Value: neonbull2024
#
# CLOUDFLARE: delete both crons from Trigger Events — not needed.
#             Keep the Worker + KV binding untouched.
# ───────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 5 minutes during morning window (3:55 AM – 5:00 AM UTC = 9:25–10:30 AM IST)
    - cron: '55,0,5,10,15,20,25,30,35,40,45,50 3-4 * * 1-5'
    # Every 5 minutes during afternoon window (8:55 AM – 10:00 AM UTC = 2:25–3:30 PM IST)
    - cron: '55,0,5,10,15,20,25,30,35,40,45,50 8-9 * * 1-5'

  # Manual trigger — force any session from the GitHub UI
  workflow_dispatch:
    inputs:
      session:
        description: 'Force session: morning or afternoon (blank = auto)'
        required: false
        default: ''

env:
  WORKER: https://neon-bull.kankipati-aaron.workers.dev

jobs:
  watchdog:
    name: Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:

      # ── 1. Check time window + portfolio state ──────────────
      - name: Should I act?
        id: check
        run: |
          # Current IST time
          IST_HOUR=$(TZ='Asia/Kolkata' date +%-H)
          IST_MIN=$(TZ='Asia/Kolkata' date +%-M)
          IST_TIME=$((IST_HOUR * 60 + IST_MIN))
          echo "IST time: ${IST_HOUR}:$(printf '%02d' $IST_MIN)"

          # Time windows in minutes since midnight IST
          MORNING_START=$((9*60+25))    # 9:25 AM
          MORNING_END=$((10*60+30))     # 10:30 AM
          AFTERNOON_START=$((14*60+25)) # 2:25 PM
          AFTERNOON_END=$((15*60+30))   # 3:30 PM

          # Forced session from manual trigger overrides window check
          FORCED="${{ github.event.inputs.session }}"

          if [ -n "$FORCED" ]; then
            SESSION="$FORCED"
            IN_WINDOW="true"
          elif [ $IST_TIME -ge $MORNING_START ] && [ $IST_TIME -le $MORNING_END ]; then
            SESSION="morning"
            IN_WINDOW="true"
          elif [ $IST_TIME -ge $AFTERNOON_START ] && [ $IST_TIME -le $AFTERNOON_END ]; then
            SESSION="afternoon"
            IN_WINDOW="true"
          else
            SESSION="none"
            IN_WINDOW="false"
          fi

          echo "session=$SESSION"       >> $GITHUB_OUTPUT
          echo "in_window=$IN_WINDOW"   >> $GITHUB_OUTPUT

          if [ "$IN_WINDOW" = "false" ]; then
            echo "⏰ Outside trading windows — nothing to do." && exit 0
          fi

          # Read portfolio state
          PORTFOLIO=$(curl -s --max-time 15 "${{ env.WORKER }}/portfolio" || echo '{}')

          TRADING_DAY=$(echo "$PORTFOLIO" | python3 -c "
          import sys,json
          try: print(str(json.load(sys.stdin).get('todaySession',{}).get('tradingDay',True)).lower())
          except: print('true')
          " 2>/dev/null || echo 'true')

          MORNING_DONE=$(echo "$PORTFOLIO" | python3 -c "
          import sys,json
          try: print(str(json.load(sys.stdin).get('todaySession',{}).get('morningDone',False)).lower())
          except: print('false')
          " 2>/dev/null || echo 'false')

          AFTERNOON_DONE=$(echo "$PORTFOLIO" | python3 -c "
          import sys,json
          try: print(str(json.load(sys.stdin).get('todaySession',{}).get('afternoonDone',False)).lower())
          except: print('false')
          " 2>/dev/null || echo 'false')

          echo "trading_day=$TRADING_DAY"       >> $GITHUB_OUTPUT
          echo "morning_done=$MORNING_DONE"     >> $GITHUB_OUTPUT
          echo "afternoon_done=$AFTERNOON_DONE" >> $GITHUB_OUTPUT

          echo "Trading day  : $TRADING_DAY"
          echo "Morning done : $MORNING_DONE"
          echo "Afternoon done: $AFTERNOON_DONE"

          # Decide if action needed
          SHOULD_RUN="false"
          if [ "$TRADING_DAY" = "false" ]; then
            echo "📅 Not a trading day."
          elif [ "$SESSION" = "morning" ] && [ "$MORNING_DONE" = "false" ]; then
            SHOULD_RUN="true"
            echo "✅ Morning window open and session not yet run — will fire."
          elif [ "$SESSION" = "afternoon" ] && [ "$AFTERNOON_DONE" = "false" ]; then
            SHOULD_RUN="true"
            echo "✅ Afternoon window open and snapshot not yet taken — will fire."
          else
            echo "✅ Session already done — skipping."
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      # ── 2. Fire with up to 3 attempts ──────────────────────
      - name: Fire — attempt 1
        if: steps.check.outputs.should_run == 'true'
        id: a1
        continue-on-error: true
        run: |
          SESSION="${{ steps.check.outputs.session }}"
          echo "▶ Attempt 1 — $SESSION"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "
          import sys,json
          try: print(json.load(sys.stdin).get('status','error'))
          except: print('error')
          " 2>/dev/null || echo 'error')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [[ "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]

      - name: Wait before retry
        if: steps.check.outputs.should_run == 'true' && steps.a1.outcome == 'failure'
        run: echo "⏳ Attempt 1 failed — waiting 3 min..." && sleep 180

      - name: Fire — attempt 2
        if: steps.check.outputs.should_run == 'true' && steps.a1.outcome == 'failure'
        id: a2
        continue-on-error: true
        run: |
          SESSION="${{ steps.check.outputs.session }}"
          echo "▶ Attempt 2 — $SESSION"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "
          import sys,json
          try: print(json.load(sys.stdin).get('status','error'))
          except: print('error')
          " 2>/dev/null || echo 'error')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [[ "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]

      - name: Wait before final retry
        if: steps.check.outputs.should_run == 'true' && steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        run: echo "⏳ Attempt 2 failed — waiting 3 more min..." && sleep 180

      - name: Fire — attempt 3 (final)
        if: steps.check.outputs.should_run == 'true' && steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        id: a3
        run: |
          SESSION="${{ steps.check.outputs.session }}"
          echo "▶ Attempt 3 (final) — $SESSION"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "
          import sys,json
          try: print(json.load(sys.stdin).get('status','error'))
          except: print('error')
          " 2>/dev/null || echo 'error')
          if [[ ! "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]; then
            echo "❌ All 3 attempts failed. Check worker logs."
            exit 1
          fi
          echo "✅ Attempt 3 succeeded — $STATUS"

      # ── 3. Summary ─────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          S1="${{ steps.a1.outputs.status }}"
          S2="${{ steps.a2.outputs.status }}"
          RAN="${{ steps.check.outputs.should_run }}"
          WIN="${{ steps.check.outputs.in_window }}"
          TD="${{ steps.check.outputs.trading_day }}"

          if   [ "$WIN"  = "false" ];    then echo "⏰ Outside window — no-op ($(TZ='Asia/Kolkata' date '+%H:%M IST'))"
          elif [ "$TD"   = "false" ];    then echo "📅 Not a trading day"
          elif [ "$RAN"  = "false" ];    then echo "✅ Already done — skipped"
          elif [ "$S1"   = "success" ];  then echo "🐂 Traded — attempt 1"
          elif [ "$S1"   = "already_ran" ]; then echo "✅ Already ran"
          elif [ "$S2"   = "success" ];  then echo "🐂 Traded — attempt 2"
          elif [ "${{ steps.a3.outcome }}" = "success" ]; then echo "🐂 Traded — attempt 3"
          else echo "❌ Failed — check logs"
          fi
