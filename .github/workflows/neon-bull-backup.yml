name: NEON BULL · Daily Trading Trigger

# ── HOW THIS WORKS ─────────────────────────────────────────────
#
# GitHub Actions is the SOLE cron trigger for NEON BULL.
# The Cloudflare Worker (worker.js) and its KV storage still live
# on Cloudflare — GitHub cannot replace those. But the scheduled
# triggers that kick off each session are 100% here.
#
# THREE CRONS:
#   1. 04:00 UTC (9:30 AM IST)  — morning decision, the only AI call
#   2. 04:45 UTC (10:15 AM IST) — catch-up: fires only if morning failed
#   3. 09:00 UTC (2:30 PM IST)  — afternoon mark-to-market (free, no AI)
#
# WHAT "BULLETPROOF" MEANS HERE:
#   - Always checks /portfolio first → skips if session already ran
#   - 3 attempts with 3-minute gaps before declaring failure
#   - Catch-up cron at 10:15 AM as a final safety net
#   - No double trades possible (already_ran guard)
#   - Full response logged on every attempt — no silent failures
#
# SETUP (one-time, required):
#   Repo → Settings → Secrets and variables → Actions → New secret
#   Name:  NEON_BULL_SECRET
#   Value: neonbull2024
#
# CLOUDFLARE: delete both crons (45 3 and 0 4) — no longer needed.
#             Keep the Worker and KV binding — those are the API server.
# ───────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 4 * * 1-5'    # 9:30 AM IST — morning decision
    - cron: '45 4 * * 1-5'   # 10:15 AM IST — catch-up safety net
    - cron: '0 9 * * 1-5'    # 2:30 PM IST  — afternoon snapshot

  workflow_dispatch:
    inputs:
      session:
        description: 'Force a session: morning or afternoon (leave blank = auto)'
        required: false
        default: ''

env:
  WORKER: https://neon-bull.kankipati-aaron.workers.dev

jobs:
  trade:
    name: Run trading session
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ── 1. Read current portfolio state ──────────────────────
      - name: Read portfolio state
        id: state
        run: |
          PORTFOLIO=$(curl -s --max-time 20 "${{ env.WORKER }}/portfolio" || echo '{}')

          MORNING_DONE=$(echo "$PORTFOLIO" | python3 -c "
          import sys,json
          try: print(str(json.load(sys.stdin).get('todaySession',{}).get('morningDone',False)).lower())
          except: print('false')
          " 2>/dev/null || echo 'false')

          TRADING_DAY=$(echo "$PORTFOLIO" | python3 -c "
          import sys,json
          try: print(str(json.load(sys.stdin).get('todaySession',{}).get('tradingDay',True)).lower())
          except: print('true')
          " 2>/dev/null || echo 'true')

          # Determine which session this trigger is for
          FORCED="${{ github.event.inputs.session }}"
          UTC_HOUR=$(date -u +%-H)
          if   [ -n "$FORCED" ];         then SESSION="$FORCED"
          elif [ "$UTC_HOUR" -ge 9 ];    then SESSION="afternoon"
          else                                SESSION="morning"
          fi

          echo "morning_done=$MORNING_DONE"  >> $GITHUB_OUTPUT
          echo "trading_day=$TRADING_DAY"    >> $GITHUB_OUTPUT
          echo "session=$SESSION"            >> $GITHUB_OUTPUT

          echo "─────────────────────────────────"
          echo " Session     : $SESSION"
          echo " Trading day : $TRADING_DAY"
          echo " Morning done: $MORNING_DONE"
          echo "─────────────────────────────────"

      # ── 2. Exit early if nothing to do ───────────────────────
      - name: Skip — not a trading day
        if: steps.state.outputs.trading_day == 'false'
        run: echo "📅 NSE holiday or weekend — nothing to do."

      - name: Skip — morning already ran
        if: |
          steps.state.outputs.trading_day == 'true' &&
          steps.state.outputs.session == 'morning' &&
          steps.state.outputs.morning_done == 'true'
        run: echo "✅ Morning session already ran today — skipping."

      # ── 3. Fire the worker (up to 3 attempts) ────────────────
      - name: Fire — attempt 1
        if: |
          steps.state.outputs.trading_day == 'true' &&
          (steps.state.outputs.session == 'afternoon' ||
           steps.state.outputs.morning_done == 'false')
        id: a1
        continue-on-error: true
        env:
          SESSION: ${{ steps.state.outputs.session }}
        run: |
          echo "▶ Attempt 1 (session: $SESSION)"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [[ "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]

      - name: Retry — wait 3 min
        if: steps.a1.outcome == 'failure'
        run: echo "⏳ Attempt 1 failed — waiting 3 minutes..." && sleep 180

      - name: Fire — attempt 2
        if: steps.a1.outcome == 'failure'
        id: a2
        continue-on-error: true
        env:
          SESSION: ${{ steps.state.outputs.session }}
        run: |
          echo "▶ Attempt 2 (session: $SESSION)"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [[ "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]

      - name: Retry — wait 3 more min
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        run: echo "⏳ Attempt 2 failed — waiting 3 more minutes..." && sleep 180

      - name: Fire — attempt 3 (final)
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        id: a3
        env:
          SESSION: ${{ steps.state.outputs.session }}
        run: |
          echo "▶ Attempt 3 — final (session: $SESSION)"
          R=$(curl -s --max-time 120 \
            "${{ env.WORKER }}/run-now?secret=${{ secrets.NEON_BULL_SECRET }}&session=$SESSION")
          echo "$R" | python3 -m json.tool 2>/dev/null || echo "$R"
          STATUS=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          if [[ ! "$STATUS" =~ ^(success|already_ran|snapshot_only|market_closed|paused)$ ]]; then
            echo "❌ All 3 attempts failed. Check the worker logs."
            exit 1
          fi
          echo "✅ Attempt 3 succeeded — status: $STATUS"

      # ── 4. Summary ───────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          S1: ${{ steps.a1.outputs.status }}
          S2: ${{ steps.a2.outputs.status }}
        run: |
          if   [ "$S1" = "success" ];      then echo "🐂 Ran on attempt 1"
          elif [ "$S1" = "already_ran" ];  then echo "✅ Already ran (other trigger beat us)"
          elif [ "$S2" = "success" ];      then echo "🐂 Ran on attempt 2 (attempt 1 was a blip)"
          elif [ "$S2" = "already_ran" ];  then echo "✅ Already ran by attempt 2 check"
          elif [ "${{ steps.a3.outcome }}" = "success" ]; then echo "🐂 Ran on attempt 3"
          elif [ "${{ steps.state.outputs.trading_day }}" = "false" ]; then echo "📅 Not a trading day"
          elif [ "${{ steps.state.outputs.morning_done }}" = "true" ]; then echo "✅ Already ran today"
          else echo "❌ All attempts failed — check logs above"
          fi
