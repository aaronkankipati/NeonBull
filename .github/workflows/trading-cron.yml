name: Neon Bull V4 Backup Cron

on:
  schedule:
    # Step 1: data + filter + news — 9:15 AM IST = 03:45 UTC
    - cron: '45 3 * * 1-5'
    # Step 2: Claude decision + execution — 9:30 AM IST = 04:00 UTC
    - cron: '0 4 * * 1-5'

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Detect step and fire
        run: |
          MINUTE=$(date -u +%M)
          if [ "$MINUTE" -ge "40" ]; then
            STEP="1"
            echo "Firing Step 1 — data fetch, filter, RSS news"
          else
            STEP="2"
            echo "Firing Step 2 — Claude decision and execution"
          fi

          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.WORKER_URL }}/run-now?secret=${{ secrets.MANUAL_SECRET }}&step=${STEP}")

          echo "HTTP status: $RESPONSE"
          echo "Response:"
          cat response.txt

          if [ "$RESPONSE" != "200" ]; then
            echo "Worker returned non-200"
            exit 1
          fi
